name: Release macOS App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_exists: ${{ steps.release_check.outputs.release_exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read marketing version
        id: version
        run: |
          version=$(sed -n 's/.*MARKETING_VERSION = \([^;]*\);/\1/p' IssueMark.xcodeproj/project.pbxproj | head -n 1 | tr -d '[:space:]')
          if [ -z "$version" ]; then
            echo "Unable to read MARKETING_VERSION from IssueMark.xcodeproj/project.pbxproj" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$version" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: release_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.release_exists == 'false' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            runner: macos-14
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          xcode_path="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort | tail -n 1)"
          if [ -z "$xcode_path" ]; then
            echo "No Xcode 16 installation found on this runner image." >&2
            ls -1 /Applications | sed 's/^/  - /'
            exit 1
          fi

          sudo xcode-select -s "$xcode_path/Contents/Developer"
          xcodebuild -version

      - name: Build IssueMark (${{ matrix.arch }})
        run: |
          xcodebuild \
            -project IssueMark.xcodeproj \
            -scheme IssueMark \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            ARCHS=${{ matrix.arch }} \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package app bundle
        id: package
        run: |
          app_path="build/Build/Products/Release/IssueMark.app"
          if [ ! -d "$app_path" ]; then
            echo "Expected app bundle not found at $app_path" >&2
            exit 1
          fi

          artifact_name="IssueMark-${{ needs.prepare.outputs.version }}-macos-${{ matrix.arch }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$artifact_name"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: IssueMark-${{ matrix.arch }}
          path: ${{ steps.package.outputs.artifact_name }}
          if-no-files-found: error

  release:
    needs:
      - prepare
      - build
    if: needs.prepare.outputs.release_exists == 'false' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: IssueMark-*
          merge-multiple: true
          path: dist

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: IssueMark ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*.zip
          overwrite_files: true
